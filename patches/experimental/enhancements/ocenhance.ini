; OCEnhance - optional camera/controls enhancements (Priority 2, not part of the 60 FPS parity patch)
; Everything is OFF by default. 0 = keep the original game value.

[camera]
; Right analog stick turns the camera (PPSSPP: map the right stick in Controls > "Analog right stick").
right_stick = 1
deadzone = 24
invert_x = 0
invert_y = 0
sensitivity_x = 100
sensitivity_y = 100
; Vertical look speed (10..300 %). invert_y = 1 swaps up/down.
pitch_speed = 100

[buttons]
; PPSSPP "Dev-kit L2/R2" mapped to an existing PSP action:
; OFF, SELECT, START, UP, RIGHT, DOWN, LEFT, L, R, L+R (= CAMERA_CENTER), TRIANGLE, CIRCLE, CROSS, SQUARE
l2 = OFF
r2 = OFF
; PPSSPP "Dev-kit L3/R3" (stick clicks). CAMERA_RECENTER = the game's camera recentre and level,
; without sending L+R to Ratchet (L+R would also crouch). Other values as above.
l3 = OFF
r3 = CAMERA_RECENTER

[view]
; Vertical field of view in degrees (original 31.5). Range 20..60.
fov_deg = 0
; Follow camera distance (original 5.0, range 2..15) and height (original 1.14, range 0.3..4).
cam_distance = 0
cam_height = 0

[debug]
debug_log = 0
