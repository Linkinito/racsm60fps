; RCSM wrapper dispatcher v0.5.0-prealpha — configuration racine sûre.
; Le fichier est lu une seule fois au lancement du jeu.

[dispatcher]
; detect_only : reconnaît les modules, sans modifier le code du jeu.
; policy_module : instrumente un seul module et applique les règles ci-dessous.
mode = detect_only

; Le mode policy_module exige un module explicite. 4 = LEVEL_04 / Metalis.
allowed_module = 4

; Toute entrée non explicitement classée reste à deux passes.
default_policy = two_pass

; Listes d'identifiants numériques, séparés par des virgules.
one_pass_families =
two_pass_families =
custom_families =

; Exceptions par adresse $ra de référence, jamais par adresse relocalisée.
one_pass_ras =
two_pass_ras =
custom_ras =

; Conserve les compteurs et les traces v5 pendant le routage.
instrumentation_enabled = true

; Détection stable avant armement : 3 x 100 ms.
poll_us = 100000
stable_polls = 3

; L+R+SELECT exporte ; L+R+START remet les compteurs à zéro.
export_on_transition = true
controls_enabled = true
