; Palier 05C — lot expérimental acteurs/mouvements, à utiliser après 05A/05B.
; Les familles armes/dégâts WF-006 à WF-012, WF-002 et les helpers
; transversaux WF-013/WF-014 restent explicitement TWO_PASS par défaut.
[dispatcher]
mode = policy_module
allowed_module = 4
default_policy = two_pass
one_pass_families = 15, 23, 25, 26, 28, 29, 30
two_pass_families = 2, 6, 7, 8, 9, 10, 11, 12, 13, 14
custom_families =
one_pass_ras =
two_pass_ras =
custom_ras =
instrumentation_enabled = true
poll_us = 100000
stable_polls = 3
export_on_transition = true
controls_enabled = true
