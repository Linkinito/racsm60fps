; RCSM wrapper profiler v0.4.5-prealpha — configuration sûre par défaut.
; Le fichier est lu une seule fois au lancement du jeu.

[profiler]
; detect_only      : aucune écriture dans le code du jeu.
; single_pokitaru  : un seul callsite vérifié dans LEVEL_01.
; focused_pokitaru : les deux branches WF-019 TriggeredDoor de LEVEL_01.
; full_module      : tous les callsites vérifiés du module actif (6 à 57).
mode = detect_only

; Clé $ra du callsite unique. Ne changer qu'avec la table fournie.
single_ra = 0x091840C0

; Famille utilisée uniquement par focused_pokitaru.
focus_family = 19

; Utilisé uniquement par full_module : 0 = tous les modules connus.
; Pour le premier essai instrumenté, conserver 1 (LEVEL_01/Pokitaru).
allowed_module = 1

; Détection stable avant armement : 3 x 100 ms par défaut.
poll_us = 100000
stable_polls = 3

; Sauvegarde une trace lors d'un changement de niveau ou à l'arrêt du plugin.
export_on_transition = true

; L+R+SELECT exporte ; L+R+START remet les compteurs à zéro.
controls_enabled = true
